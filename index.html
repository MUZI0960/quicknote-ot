<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuickNote for OT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh;padding:1.5rem 1rem;}
.container{max-width:700px;margin:0 auto;}
header{margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:20px;font-weight:600;color:#1a1a1a;}
header p{font-size:13px;color:#888;margin-top:4px;}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;}
.dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.dot.online{background:#4caf50;}
.card{background:#fff;border-radius:14px;border:1px solid #e8e8e4;padding:1.25rem;margin-bottom:1rem;}
.card-title{font-size:13px;font-weight:500;color:#888;margin-bottom:12px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cat-btn{padding:10px 12px;border-radius:10px;border:1px solid #e0e0db;background:#fff;color:#555;font-size:13px;cursor:pointer;text-align:left;line-height:1.4;transition:all 0.1s;}
.cat-btn:hover{background:#f8f8f5;border-color:#ccc;}
.cat-btn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.cat-btn .cat-sub{font-size:11px;opacity:0.65;display:block;margin-top:2px;}
.btn-generate{width:100%;height:44px;border-radius:10px;border:none;background:#1a1a1a;color:#fff;font-size:15px;font-weight:500;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-generate:hover{background:#333;}
.btn-generate:disabled{opacity:0.4;cursor:not-allowed;}
.result-item{padding:14px 16px;background:#f8f8f5;border-radius:10px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
.result-num{width:22px;height:22px;border-radius:50%;background:#1a1a1a;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.result-text{font-size:14px;color:#1a1a1a;line-height:1.65;flex:1;}
.result-copy{background:transparent;border:1px solid #e0e0db;border-radius:7px;padding:4px 10px;font-size:12px;color:#888;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.result-copy:hover{border-color:#999;color:#333;}
.result-copy.copied{border-color:#1baf7a;color:#1baf7a;}
.btn-copy-all{width:100%;height:38px;border-radius:10px;border:1px solid #e0e0db;background:#fff;color:#555;font-size:13px;cursor:pointer;margin-top:4px;}
.btn-copy-all:hover{background:#f8f8f5;}
.history-row{font-size:12px;color:#888;padding:7px 10px;margin-bottom:5px;line-height:1.5;border-left:3px solid #e0e0db;border-radius:0;}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:#e8e8e4;color:#666;margin-right:6px;}
.week-badge{font-size:11px;color:#aaa;margin-bottom:8px;}
.error{color:#e24b4a;font-size:13px;padding:8px;text-align:center;}
.btn-reset{font-size:12px;color:#bbb;background:transparent;border:1px solid #e8e8e4;border-radius:8px;padding:5px 12px;cursor:pointer;}
.btn-reset:hover{color:#e24b4a;border-color:#e24b4a;}
.divider{border:none;border-top:1px solid #f0f0ea;margin:1rem 0;}
.loading{text-align:center;color:#aaa;font-size:13px;padding:1rem;}
.config-notice{background:#FFF8E8;border:1px solid #F5D98B;border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:13px;color:#7A5C00;line-height:1.6;}
.config-notice strong{display:block;margin-bottom:4px;font-size:14px;}
.config-notice code{background:#fff;border-radius:4px;padding:1px 6px;font-family:monospace;font-size:12px;}

</head>

<div class="container">
  <header>
    <div>
      <h1>QuickNote for OT</h1>

    </div>
    <div class="status">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">연결 중...</span>

    <strong>⚙️ Firebase 설정 필요</strong>

  <div class="card">
    <div class="card-title">환자 상태 선택 (복수 선택 가능)</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <button class="btn-generate" id="btn-gen" onclick="generate()">✦ 코멘트 3개 생성</button>

  <div id="result-wrap" style="margin-top:1rem;display:none;">
    <div class="card">
      <div class="card-title">생성된 코멘트</div>
      <div id="result-list"></div>
      <button class="btn-copy-all" onclick="copyAll()">전체 복사</button>
    </div>
  </div>

  <div id="history-wrap" style="display:none;">
    <div class="card">
      <div class="card-title">이번 주 생성 기록</div>
      <div class="week-badge" id="week-label"></div>
      <div id="history-list"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px;">
        <button class="btn-reset" onclick="resetWeek()">이번 주 기록 초기화</button>
      </div>
    </div>
  </div>
</div>

    a:["양말·신발 신고 벗기 독립 훈련","젓가락질 정확도 향상 훈련","grooming 독립 수행 훈련","home management 훈련 (설거지·빨래·청소)","meal preparation 독립 훈련","functional mobility 훈련 (계단·경사로·장애물)","community 활동 훈련 (마트·대중교통·ATM)","communication device 사용 훈련","money management 훈련","시간에 맞춰 약 복용하기 훈련"],
  },
  rdt:{
    p:["치료사가 manual Ex.를 통해","ice stick을 이용하여","거즈를 이용하여","verbal cue를 통한","mirror feedback을 통한","thermal tactile stimulation을 통한"],
    a:["lip closure 증진 훈련","tongue movement 증진 훈련 (protraction·retraction)","저작근 stimulation을 통한 chewing 증진","facial muscle movement 증진 훈련","drooling 감소 훈련","oral motor 기능 증진 훈련","soft palate elevation 유도","pharyngeal swallowing 증진 훈련","chin-tuck 자세를 통한 swallowing facilitation","effortful swallowing 훈련","Mendelsohn maneuver 훈련","supraglottic swallowing 훈련","aspiration 최소화를 위한 자세 훈련","cough 유도 및 기도 보호 훈련","buccinator m. strengthening 훈련","tongue base 강화 훈련","swallowing reflex 유도 훈련"],
    t:["ice stick","거즈","ice bar","레모나","빨대","vibrator"],
  },
};

let sel = [];
let lastResults = [];
let weekComments = {}; // Firebase에서 실시간으로 받아오는 이번 주 기록

function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Firebase 실시간 구독 — 이번 주 기록 감시
onValue(weekRef, snap => {
  weekComments = snap.val() || {};
  renderHistory(weekComments);
});

function buildComment(keys, usedNow){
  const allUsed = [...Object.values(weekComments).map(v=>v.text), ...usedNow];
  for(let i=0;i<300;i++){
    const k = rnd(keys);
    const D = T[k];
    if(!D) continue;
    const hasTool = D.t && D.t.length > 0;
    const rv = Math.random();
    let comment;
    if(rv < 0.33 && hasTool){
      comment = `* ${rnd(D.t)} — ${rnd(D.a)}`;
    } else if(rv < 0.66){
      comment = `* ${rnd(D.p)} ${rnd(D.a)}`;
    } else if(hasTool){
      comment = `* ${rnd(D.t)} — ${rnd(D.p)} ${rnd(D.a)}`;
    } else {
      comment = `* ${rnd(D.p)} ${rnd(D.a)}`;
    }
    const norm = comment.replace(/\s+/g,'');
    if(!allUsed.some(x => x && x.replace(/\s+/g,'') === norm)) return comment;
  }
  const k = rnd(keys);
  return `* ${rnd(T[k].a)}`;
}

window.generate = async function(){
  if(!sel.length){
    document.getElementById('result-wrap').innerHTML='<div class="error">카테고리를 하나 이상 선택해주세요.</div>';
    document.getElementById('result-wrap').style.display='block';
    return;
  }
  const btn = document.getElementById('btn-gen');
  btn.disabled = true;
  btn.textContent = '생성 중...';

  const results = [];
  for(let i=0;i<3;i++){
    results.push(buildComment(sel, results));
  }
  lastResults = results;

  // Firebase에 저장
  const cats = sel.map(k=>CATS.find(c=>c.key===k)?.label).join('·');
  for(const text of results){
    await push(weekRef, { text, cats, ts: Date.now() });
  }

  document.getElementById('result-list').innerHTML = results.map((r,i)=>`
    <div class="result-item">
      <div class="result-num">${i+1}</div>
      <div class="result-text">${esc(r)}</div>
      <button class="result-copy" id="cp${i}" onclick="copyOne(${i},this)">복사</button>
    </div>`).join('');
  document.getElementById('result-wrap').style.display = 'block';

  btn.disabled = false;
  btn.textContent = '✦ 코멘트 3개 생성';
};

window.copyOne = function(i, btn){
  navigator.clipboard.writeText(lastResults[i]||'').then(()=>{
    btn.textContent='✓ 복사됨'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='복사'; btn.classList.remove('copied');}, 1500);
  });
};
window.copyAll = function(){ navigator.clipboard.writeText(lastResults.join('\n')); };

window.resetWeek = async function(){
  if(!confirm('이번 주 기록을 전체 초기화할까요?')) return;
  await remove(weekRef);
};

function renderHistory(data){
  const items = Object.values(data||{}).sort((a,b)=>b.ts-a.ts);
  if(!items.length){ document.getElementById('history-wrap').style.display='none'; return; }
  document.getElementById('history-wrap').style.display = 'block';
  document.getElementById('week-label').textContent = WEEK_KEY + ' 주 기록 (' + items.length + '개)';
  document.getElementById('history-list').innerHTML = items.slice(0,20).map(h=>`
    <div class="history-row">
      <span class="badge">${esc(h.cats||'')}</span>${esc(h.text)}
    </div>`).join('');
}

function renderCats(){
  document.getElementById('cat-grid').innerHTML = CATS.map(c=>`
    <button class="cat-btn${sel.includes(c.key)?' on':''}" onclick="toggleCat('${c.key}')">
      ${esc(c.label)}<span class="cat-sub">${esc(c.sub)}</span>
    </button>`).join('');
}
window.toggleCat = function(k){ sel=sel.includes(k)?sel.filter(x=>x!==k):[...sel,k]; renderCats(); };

renderCats();
</script>
